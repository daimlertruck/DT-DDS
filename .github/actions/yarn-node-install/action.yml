name: Setup node and yarn

description: Action to setup Node.js, yarn and install dependencies

inputs:
  NODE_VERSION:
    description: The node version to be installed
    required: false
    default: '22'
  NPM_TOKEN:
    description: NPM token for publishing to npmjs.org
    required: false
  TURBO_CACHE:
    description: Persist the local turbo cache (.turbo/cache) between runs of the same job
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Install Node
    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.NODE_VERSION }}
        registry-url: 'https://registry.npmjs.org'
      env:
        NODE_AUTH_TOKEN: ${{ inputs.NPM_TOKEN }}

    # Setup npm authentication if token is provided
    - name: Setup npm authentication
      if: inputs.NPM_TOKEN != ''
      shell: bash
      run: |
        echo "//registry.npmjs.org/:_authToken=${{ inputs.NPM_TOKEN }}" > .npmrc

    # As we're using self-hosted runners we need to install yarn
    - name: Install yarn
      shell: bash
      run: |
        npm install -g yarn
        npm install turbo --global

    # Yarn v1 doesn't record workspace packages in yarn.lock, so the key also hashes every
    # package.json. Install always runs on top of the restored tree to relink workspace packages.
    - name: Restore node_modules cache
      uses: actions/cache@v4
      with:
        path: |
          **/node_modules
          !**/node_modules/.cache
        key: node-modules-${{ runner.os }}-node-v${{ inputs.NODE_VERSION }}-${{ hashFiles('yarn.lock', '**/package.json', '!**/node_modules/**', '!examples/**') }}
        restore-keys: |
          node-modules-${{ runner.os }}-node-v${{ inputs.NODE_VERSION }}-

    - name: Install dependencies
      shell: bash
      run: yarn install --frozen-lockfile --non-interactive

    # Turbo hashes the task inputs (source files included), so a restored cache can't replay stale outputs
    - name: Restore turbo cache
      if: inputs.TURBO_CACHE == 'true'
      uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-

    # Restored entries keep their mtime, so this bounds the cache size across runs
    - name: Prune stale turbo cache entries
      if: inputs.TURBO_CACHE == 'true'
      shell: bash
      run: |
        if [ -d .turbo/cache ]; then
          find .turbo/cache -type f -mtime +7 -delete
        fi
